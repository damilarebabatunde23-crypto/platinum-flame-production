version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_URL=postgres://platinum:flamepass2026@db:5432/platinum_flame_db
      - NOTIFICATION_RECIPIENT_EMAIL=Mypersonlemailboxln@gmail.com
      - GMAIL_USER=Mypersonlemailboxln@gmail.com
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=platinum_flame_db
      - POSTGRES_USER=platinum
      - POSTGRES_PASSWORD=flamepass2026
    ports:
      - "5432:5432"

volumes:
  postgres_data:
  media_volume:
