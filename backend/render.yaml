services:
  - type: web
    name: platinum-flame-production
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input"
    startCommand: "python manage.py migrate --no-input && gunicorn studio_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: platinum-flame-db
          property: connectionString
      - key: NOTIFICATION_RECIPIENT_EMAIL
        value: mypersonalemailboxln@gmail.com
      - key: GMAIL_USER
        value: mypersonalemailboxln@gmail.com
      - key: GMAIL_APP_PASSWORD
        value: "qwfx izpe noev dbll"

databases:
  - name: platinum-flame-db
    region: oregon
    plan: free
